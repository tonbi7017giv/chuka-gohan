<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中華 新龍</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
<header class="header">
  <div class="header__inner">
    <a class="header__logo" href="index.html">
      中華 <span>新龍</span>
    </a>

    <nav class="header__nav" aria-label="メインメニュー">
      <ul>
        <li><a href="index.html">ホーム</a></li>
        <li><a href="menu.html">メニュー</a></li>
        <li><a href="about.html">当店について</a></li>
      </ul>
    </nav>

     <a class="header__button" href="tel:0000000000">電話予約</a>
  </div>
</header>

    <section class="hero">
      <img
        class="hero__image"
        src="images/hero-chinese-food.jpeg"
        alt="湯気が立つ圧倒的チャーハン"
      />

      <div class="hero__content">
        <h1 class="hero__title">熱々の一皿に、<br />心を込めて。</h1>
      </div>
    </section>

    <section class="news" aria-labelledby="news-title">
      <div class="news__inner">
        <div class="news__heading">
          <h2 id="news-title">おしながき</h2>
        </div>

        <div class="news__list">
          <article class="news-card">
            <img
              class="news-card__image"
              src="images/card-gyoza.jpeg"
              alt="焼きたて餃子"
            />
            <p class="news-card__meta">
            </p>
            <h4>口の中で肉汁が溢れ出す焼きたて餃子</h4>
          </article>

          <article class="news-card">
            <img
              class="news-card__image"
              src="images/card-ramen.jpeg"
              alt="一番人気!!担々麺"
            />
            <p class="news-card__meta">
            </p>
            <h4>花椒の刺激が食欲を増す担々麺</h4>
          </article>

          <article class="news-card">
            <img
              class="news-card__image"
              src="images/card-yurinchi.jpeg"
              alt="タレが滴る油淋鶏"
            />
            <p class="news-card__meta">
            </p>
            <h4>あと引くタレとパリッと食感の油淋鶏</h4>
          </article>

        </div>
        <a href="#" class="news-list__more">詳しく見る</a>

      </div>
    </section>

    <section class="access" id="access">
      <div class="access__inner">
        <div class="access__info">
          <h2>店舗情報</h2>

           <dl>
        <div>
          <dt>住所</dt>
          <dd>〒000-0000 愛知県名古屋市○○ 1-2-3</dd>
        </div>

        <div>
          <dt>営業時間</dt>
          <dd>11:00〜22:00</dd>
        </div>

        <div>
          <dt>定休日</dt>
          <dd>毎週水曜日</dd>
        </div>
      </dl>
    </div>

    <div class="access__map">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3261.426566615952!2d136.87895661022674!3d35.17091935772636!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x600376e794d78b89%3A0x81f7204bf8261663!2z5ZCN5Y-k5bGL6aeF!5e0!3m2!1sja!2sjp!4v1790113007661!5m2!1sja!2sjp"
      width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>

  </body>
</html>
