<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umaichihanten</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <section class="hero">
      <img
        class="hero__image"
        src="images/hero-chinese-food.jpeg"
        alt="湯気が立つ本格麻婆豆腐"
      />

      <div class="hero__content">
        <h1 class="hero__title">熱々の一皿に、<br />心を込めて。</h1>
      </div>
    </section>

    <section class="news" aria-labelledby="news-title">
      <div class="news__inner">
        <div class="news__heading">
          <h2 id="news-title">おしながき</h2>
        </div>

        <div class="news__list">
          <article class="news-card">
            <img
              class="news-card__image"
              src="images/card-gyoza.jpeg"
              alt="焼きたて餃子"
            />
            <p class="news-card__meta">
              <time datetime="2026-09-19">2026.09.19</time>
              <span>イチ押し</span>
            </p>
            <h3>秋限定メニューを開始しました</h3>
            <a href="#">詳しく見る</a>
          </article>

          <article class="news-card">
            <img
              class="news-card__image"
              src="images/card-ramen.jpeg"
              alt="一番人気!!担々麺"
            />
            <p class="news-card__meta">
              <time datetime="2026-09-10">2026.09.10</time>
              <span>イベント</span>
            </p>
            <h3>週末限定のランチセットをご用意しています</h3>
            <a href="#">詳しく見る</a>
          </article>

          <article class="news-card">
            <img
              class="news-card__image"
              src="images/card-yurinchi.jpeg"
              alt="タレが滴る油淋鶏"
            />
            <p class="news-card__meta">
              <time datetime="2026-09-01">2026.09.01</time>
              <span>営業時間</span>
            </p>
            <h3>9月の営業日について</h3>
            <a href="#">詳しく見る</a>
          </article>
        </div>
      </div>
    </section>
  </body>
</html>
